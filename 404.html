<head>

  <style>
    /* Full cinematic dark experience */
    .error-page-body {
      background: var(--dark); /* Deep luxury green */
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow: hidden; /* Prevent scrolling, 100% immersive */
      color: var(--cream);
    }
    
    /* Transparent navbar integration */
    .error-page-body .navbar {
      background: transparent;
      border-bottom: 1px solid rgba(212, 193, 123, 0.15); /* Delicate gold line */
      box-shadow: none;
      position: absolute;
    }
    .error-page-body .nav-links a {
      color: rgba(245, 239, 224, 0.9);
    }
    .error-page-body .nav-links a:hover {
      color: var(--gold);
    }
    .error-page-body .hamburger span {
      background: var(--cream);
    }

    /* Container for 404 content */
    .four-o-four-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Background texture */
    .four-o-four-bg {
      position: absolute;
      inset: 0;
      background-image: url('/style/images/hero-bg-navami.png');
      background-size: cover;
      background-position: center;
      opacity: 0.06;
      z-index: 0;
      mix-blend-mode: overlay;
    }
    
    /* Radial gradient for focus */
    .four-o-four-shadow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 0%, var(--dark) 80%);
      z-index: 1;
    }

    /* Content styling */
    .four-o-four-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 5vw;
      animation: floatUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .four-o-four-eyebrow {
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: -10px;
      display: block;
      opacity: 0.9;
    }

    .four-o-four-number {
      font-family: 'Playfair Display', serif;
      font-size: clamp(120px, 25vw, 280px);
      font-weight: 900;
      background: linear-gradient(135deg, #F3E7C9 0%, #D4C17B 50%, #A58B3A 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin: 0;
      letter-spacing: -0.04em;
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.5));
    }

    .four-o-four-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 700;
      color: var(--cream);
      margin: 10px 0 20px;
      letter-spacing: 0.02em;
    }

    .four-o-four-desc {
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      color: rgba(245, 239, 224, 0.7);
      max-width: 480px;
      margin: 0 auto 40px;
      line-height: 1.7;
      font-weight: 300;
    }

    /* Minimalist luxury buttons */
    .four-o-four-actions {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }

    .btn-gold-outline {
      border: 1px solid rgba(212, 193, 123, 0.4);
      background: transparent;
      color: var(--gold);
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 16px 36px;
      border-radius: 40px;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-gold-outline:hover {
      background: var(--gold);
      color: var(--dark);
      border-color: var(--gold);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(212, 193, 123, 0.2);
    }
    
    .btn-cream-solid {
      background: var(--cream);
      color: var(--dark);
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 16px 36px;
      border-radius: 40px;
      text-decoration: none;
      transition: all 0.4s ease;
    }
    
    .btn-cream-solid:hover {
      background: #fff;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(40px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Mobile handling */
    @media (max-width: 600px) {
      .four-o-four-actions {
        flex-direction: column;
        width: 100%;
        gap: 16px;
      }
      .btn-gold-outline, .btn-cream-solid {
        width: 100%;
      }
    }
  </style>
</head>

    const hamburger   = document.getElementById('hamburger');
    const mobileMenu  = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', () => {

    });

    function closeMobileMenu() {
      mobileMenu.classList.remove('open');
    }
  </script>
